name: Build and Release

# Builds the distributable plugin zip (including Composer dependencies) and
# publishes a GitHub Release whenever the plugin version in the header changes.
# The release is version-driven: if the release for the current version already
# has the plugin zip attached, the job is a no-op. If the tag or release exists
# without the zip (e.g. a release created by hand, or an earlier failed build),
# the zip is built from the tagged commit and attached to that release.
# This pairs with the "always increase the version number after changes"
# policy — bump the version, get a release.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(grep -oiP '^\s*\*\s*Version:\s*\K[0-9][0-9.]*' gravityforms-plivo.php | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not read the plugin version from gravityforms-plivo.php."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected plugin version: $VERSION (tag v$VERSION)"

      - name: Check whether the release zip already exists
        id: tagcheck
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)
          if grep -qx 'gravityforms-plivo.zip' <<< "$ASSETS"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already has gravityforms-plivo.zip; nothing to release."
            exit 0
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without the release zip; building it from the tagged commit."
            git fetch --no-tags --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
            git checkout --detach "$TAG"
          else
            echo "Tag $TAG does not exist; a release will be built."
          fi

      - name: Set up PHP
        if: steps.tagcheck.outputs.exists == 'false'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer

      - name: Install production dependencies
        if: steps.tagcheck.outputs.exists == 'false'
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Build release package
        if: steps.tagcheck.outputs.exists == 'false'
        run: |
          set -euo pipefail
          PLUGIN_SLUG=gravityforms-plivo
          rm -rf build
          mkdir -p "build/${PLUGIN_SLUG}"
          rsync -a ./ "build/${PLUGIN_SLUG}/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/' \
            --exclude 'node_modules/' \
            --exclude '.gitignore' \
            --exclude '.distignore' \
            --exclude '*.log'
          ( cd build && zip -rq "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}" )

          # List into a file rather than piping into head/grep -q, which would
          # SIGPIPE unzip and fail the step under pipefail.
          unzip -Z1 "build/${PLUGIN_SLUG}.zip" > build/contents.txt
          for required in gravityforms-plivo.php vendor/autoload.php; do
            if ! grep -qx "${PLUGIN_SLUG}/${required}" build/contents.txt; then
              echo "::error::${required} is missing from the release zip."
              exit 1
            fi
          done
          echo "Built build/${PLUGIN_SLUG}.zip ($(wc -l < build/contents.txt) entries, $(du -h "build/${PLUGIN_SLUG}.zip" | cut -f1))"

      - name: Create GitHub Release
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: build/gravityforms-plivo.zip
